name: pangolin
services:
  pangolin:
    user: "${PUID}:${PGID}"
    image: docker.io/fosrl/pangolin:${pangolin_version}
    container_name: pangolin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    volumes:
      - ./pangolin:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  gerbil:
    #user: "${PUID}:${PGID}"
    image: docker.io/fosrl/gerbil:${gerbil_version}
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=${savekey}
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./pangolin:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      #- SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - 51821:51821/udp # Newt
      - 21820:21820/udp # Gerbil
      - 443:443
      #- 80:80
  traefik:
    user: "${PUID}:${PGID}"
    image: docker.io/traefik:${traefik_version}
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
     # Add the environment variables for your DNS provider.
    environment:
      CLOUDFLARE_DNS_API_TOKEN: "${CLOUDFLARE_TOKEN}" #${cloudflare_token}
    volumes:
      - ./pangolin/traefik:/etc/traefik:ro # Volume to store the Traefik configuration
      - ./pangolin/traefik/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      - ./pangolin/traefik/logs:/var/log/traefik # Volume to store Traefik logs
      - ./pangolin/traefik/rules:/rules
      - ./pangolin/traefik/plugins-storage:/plugins-storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  middleware-manager:
    user: "${PUID}:${PGID}"
    image: hhftechnology/middleware-manager:${middleware_manager_version}
    container_name: middleware-manager
    network_mode: service:gerbil
    restart: unless-stopped
    volumes:
     - ./middleware-manager:/data
     - ./middleware-manager/config:/app/config
     - ./pangolin/traefik/rules:/conf
     #- ./middleware-manager/templates.yaml:/app/config/templates.yaml  # Optional custom templates
    environment:
    - ACTIVE_DATA_SOURCE=pangolin
     - PANGOLIN_API_URL=http://pangolin:3001/api/v1
     - TRAEFIK_CONF_DIR=/conf
     - TRAEFIK_STATIC_CONFIG_PATH=/etc/traefik/traefik_config.yml
     - DB_PATH=/data/middleware.db
     - PORT=3456
    cap_drop:
     - ALL
    security_opt:
     - no-new-privileges:true
    ports:
     - "${LISTENING_ADDRESS}:3456:3456"
networks:
  default:
    driver: bridge
    name: pangolin