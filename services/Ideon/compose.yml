services:
  ideon-app:
    image: ghcr.io/3xpyth0n/ideon:${ideon_version}
    container_name: ideon-app
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PUID: ${PUID} # Optional: User ID for file ownership (default: 1001)
      PGID: ${PGID} # Optional: Group ID for file ownership (default: 1001)
    depends_on:
      ideon-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${LISTEN_ADDRESS}:${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./ideon/storage:/app/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-3000}/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ideon-db:
    user: "${PUID}:${PGID}"
    image: postgres:18-alpine
    container_name: ideon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
      #- FOWNER
      #- DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 5
