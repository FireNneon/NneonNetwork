# Borg Backup Server — Docker Compose
#
# Quick start:
#   1. Copy .env.example to .env and edit it:
#        cp .env.example .env
#   2. Set APP_URL to this machine's hostname or IP (required for agents to connect)
#   3. Start the container:
#        docker compose up -d
#   4. View admin credentials:
#        docker compose logs bbs
#
# All data (database, repositories, SSH keys) is stored in the bbs-data volume.

services:
  bbs:
    # In my setup I don't use latest tag in the image. I like to be able to control the version I use so everything is predictable. -Nneon
    image: marcpope/borgbackupserver:${VERSION}
    # build: .    # uncomment to build locally instead of pulling from Docker Hub
    container_name: bbs
    ports:
      # For my setup specfically I have this behind tailscale/Headscale so I added the "${LISTEN_ADDRESS}". To make it listen on all interfaces, you can remove "${LISTEN_ADDRESS}" - Nneon
      - "${LISTEN_ADDRESS}:${WEB_PORT:-8080}:80" # Web UI 
      - "${LISTEN_ADDRESS}:${SSH_PORT:-2222}:22" # SSH for borg agent connections
    environment:
      - APP_URL=${APP_URL:-http://localhost:8080}
      - SSH_PORT=${SSH_PORT:-2222}
      # Map the app user (www-data) to your host user's UID/GID. Fixes permission
      # issues with bind mounts, especially on btrfs filesystems (e.g. Synology).
      # Changing these after first run triggers an automatic ownership migration.
      # Find your values with: id -u && id -g
      - PUID=${PUID:-33}
      - PGID=${PGID:-33}
      # Advanced: remap MariaDB / ClickHouse UIDs too (see .env.example)
      # - MYSQL_PUID=${MYSQL_PUID:-100}
      # - MYSQL_PGID=${MYSQL_PGID:-100}
      - CH_PUID=${CH_PUID:-999}
      - CH_PGID=${CH_PGID:-999}
      # Admin password — only used on first run. Omit to auto-generate (shown in logs).
      - ADMIN_PASS=${ADMIN_PASS}

    cap_drop: # added for extra hardening, but cap_drop can break things, so we fix this by adding cap_add with the permissions it needs, Which is found by troubleshooting. - Nneon
      - all
    cap_add: # added this to fix it stuff. - Nneon
    - FOWNER # needed for boot - Nneon
    - CHOWN # needed for boot - Nneon
    - SETUID # needed for boot - Nneon
    - SETGID # needed for boot - Nneon
    - DAC_OVERRIDE # needed for boot - Nneon
    - AUDIT_WRITE # needed for Client Repo creation via GUI - Nneon
    volumes:
      - /opt/docker/borgserver:/var/bbs
      - /mnt/borg-backups:/var/bbs/home
    restart: unless-stopped
    # Docker's default json-file log driver has no size limit, which means
    # container output (mostly ClickHouse's internal warnings) will grow
    # unbounded over time. Cap it at ~30 MB total — plenty for recent
    # diagnostics, nothing close to filling a disk. Adjust if you want more
    # history; rotation is honored automatically.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"