services:
  panel:
    user: "${PUID}:${PGID}"
    group_add:
    - "82"
    image: ghcr.io/pelican-dev/panel:${PelicanPanel_version}
    container_name: pelican-panel
    restart: always
    networks:
      - frontend
      - pelican_internal
    #ports:
      #- "${LISTENING_ADDRESS}:80:80"
      #- "${LISTENING_ADDRESS}:443:443"
    #extra_hosts:
      #- "host.docker.internal:host-gateway"
    volumes:
      - ./pelican-data:/pelican-data
      - ./pelican-logs:/var/www/html/storage/logs
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: "${APP_URL}"
      APP_ENV: "production"
      BEHIND_PROXY: "true"
      #APP_INSTALLED: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
      #- DAC_OVERRIDE
      #- NET_BIND_SERVICE
  redis:
    user: "${PUID}:${PGID}"
    image: redis:alpine
    container_name: pelican-redis
    restart: always
    networks:
      - pelican_internal
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes --requirepass ${Redis_pass}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
  postgres:
    user: "${PUID}:${PGID}"
    image: postgres:17-alpine
    container_name: pelican-postgres
    restart: always
    networks:
      - pelican_internal
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
      #- DAC_OVERRIDE
networks:
  frontend:
    external: true
  pelican_internal:
    driver: bridge