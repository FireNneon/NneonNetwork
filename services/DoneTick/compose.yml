services:
  donetick:
    image: donetick/donetick:${Donetick_version}
    user: "${PUID}:${PGID}"
    container_name: donetick
    restart: unless-stopped
    #ports:
      #- ${LISTENING_ADDRESS}:2021:2021
    networks:
      - frontend
    volumes:
      - ./data:/donetick-data
      - ./config:/config
    environment:
      - DT_ENV=selfhosted
      - DT_SQLITE_PATH=/donetick-data/donetick.db
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:2021/api/v1/health || exit 1
      start_period: 1m
      timeout: 5s
      interval: 1m
      retries: 3
networks:
  frontend:
    external: true
