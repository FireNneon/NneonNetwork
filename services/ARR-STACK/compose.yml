services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${prowlarr_version}
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
    #ports:
      #- ${LISTEN_ADDRESS}:9696:9696
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    #networks:
      #- internal_ARR
    network_mode: "service:gluetun"
    depends_on:
      - gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:${sonarr_version}
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - /mnt/jellyfin-media:/data
      #- /path/to/tvseries:/tv #optional
      #- /path/to/downloadclient-downloads:/downloads #optional
    #ports:
      #- ${LISTEN_ADDRESS}:8989:8989
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    #networks:
    #  - internal_ARR
    #  - frontend
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
  radarr:
    image: lscr.io/linuxserver/radarr:${radarr_version}
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - /mnt/jellyfin-media:/data
    #ports:
      #- ${LISTEN_ADDRESS}:7878:7878
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    #networks:
      #- internal_ARR
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:${flaresolverr_version}
    container_name: flaresolverr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    #ports:
      #- "${PORT:-8191}:8191"
    #volumes:
    #  - /var/lib/flaresolver:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
    #networks:
      #- internal_ARR
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
  seerr:
    image: ghcr.io/seerr-team/seerr:${seerr_version}
    init: true
    user: "${PUID}:${PGID}"
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      #- PUID=${PUID}
      #- PGID=${PGID}
      - TZ=${TZ}
      - PORT=5055 #optional
    #ports:
      #- ${LISTEN_ADDRESS}:5055:5055
    volumes:
      - ./seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    #labels:
    #  - 'traefik.enable=true'
    #    ## HTTP Routers
    #  - 'traefik.http.routers.seerr-rtr.entrypoints=https'
    #  - 'traefik.http.routers.seerr-rtr.rule=Host(`seerr.domain.com`)'
    #  - 'traefik.http.routers.seerr-rtr.tls=true'
    #  ## HTTP Services
    #  - 'traefik.http.routers.seerr-rtr.service=seerr-svc'
    #  - 'traefik.http.services.seerr-svc.loadbalancer.server.port=5055'
    networks:
      - internal_ARR
      - frontend
    #network_mode: "service:gluetun"
    #depends_on:
    #  - gluetun
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:${profilarr_version}
    container_name: profilarr
    #ports:
      #- '6868:6868'
    volumes:
      - ./profilarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Uncomment ORIGIN if you use a reverse proxy to access your containers.
      #- ORIGIN=https://profilarr.yourdomain.com
      #- PARSER_HOST=parser
      #- PARSER_PORT=5000
    #networks:
    #  - internal_ARR
    #  - frontend
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
  #pinchflat:
  #  image: ghcr.io/communitymaintained/pinchflat:${pinchflat_version}
  #  container_name: pinchflat
  #  user: "${PUID}:${PGID}"
  #  environment:
  #    #- PUID=${PUID}
  #    #- PGID=${PGID}
  #    - TZ=${TZ}Z}
  #  #ports:
  #  #  - '8945:8945'
  #  volumes:
  #    - ./pinchflat:/config
  #    - /mnt/jellyfin-media/media/youtube:/downloads
  #  #networks:
  #  #  - internal_ARR
  #  #  - frontend
  #  network_mode: "service:gluetun"
  #  depends_on:
  #    - gluetun
  #  security_opt:
  #    - no-new-privileges:true
  #  cap_drop:
  #    - ALL
  #  #cap_add:
  #    #- SETUID
  #    #- SETGID
  #    #- CHOWN
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:${cleanuparr_version}
    container_name: cleanuparr
    restart: unless-stopped
    #ports:
    #  - "11011:11011"
    volumes:
      - ./cleanuparr:/config
      - /mnt/jellyfin-media/torrents/:/downloads
    environment:
      - PORT=11011
      - BASE_PATH=
      - UMASK=022
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    #networks:
    #  - internal_ARR
    #  - frontend
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:${autobrr_version}
    restart: unless-stopped
    #logging:
    #  driver: json-file
    #  options:
    #    max-file: ${DOCKERLOGGING_MAXFILE}
    #    max-size: ${DOCKERLOGGING_MAXSIZE}
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ./autobrr:/config
    #ports:
    #  - 7474:7474
    #networks:
    #  - internal_ARR
    #  - frontend
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
    #  - SETUID
    #  - SETGID
    #  - CHOWN
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${qbittorrent_version}
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      #- TORRENTING_PORT=7881
    volumes:
      - ./:/config
      - /mnt/jellyfin-media:/data
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    stop_grace_period: "10s" #optional
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
  gluetun:
    image: qmcgaw/gluetun:${gluetun_version}
    container_name: gluetun
    # line above must be uncommented to allow external containers to connect.
    # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/connect-a-container-to-gluetun.md#external-container-to-gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${LISTEN_ADDRESS}:8080:8080" #Qbittorrent WebGUI
      - "${LISTEN_ADDRESS}:9696:9696" #prowlarr WebGUI
      - "${LISTEN_ADDRESS}:8989:8989" # Sonarr WebGUI
      - "${LISTEN_ADDRESS}:7878:7878" # Radarr WebGUI
      - "${LISTEN_ADDRESS}:6868:6868" # Profilarr WebGUI
      - "${LISTEN_ADDRESS}:8945:8945" # Pinchflat WebGUI
      - "${LISTEN_ADDRESS}:11011:11011" # Cleanuparr WebGui??
      - "${LISTEN_ADDRESS}:7474:7474" # Autobrr WebGUI??
      #- "${LISTEN_ADDRESS}:5055:5055" # Seerr WebGUI
      - 8191:8191
    volumes:
      - ./gluetun:/gluetun
      - ./gluetun/tmp:/tmp/gluetun
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      # or https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      #- SERVER_CITIES=New York NY
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      #- WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESS} # Only needed for some providers. 
      # Timezone for accurate log times
      - TZ=${TZ}
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      #- UPDATER_PERIOD=480h
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      #- PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      #- VPN_PORT_FORWARDING_STATUS_FILE=/tmp/gluetun/forwarded_port
      #- VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      #- VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      #- FIREWALL_VPN_INPUT_PORTS=7881
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      #- SETUID
      #- SETGID
      - CHOWN
      - NET_ADMIN #this was listed on the example compose.
      - NET_RAW
      - DAC_OVERRIDE
    networks:
      - internal_ARR
networks:
  internal_ARR:
    driver: bridge
  frontend:
    external: true