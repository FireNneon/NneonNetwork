name: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    user: "${PUID}:${PGID}"
    # For hardware acceleration, uncomment the extends section below
    # and set the service to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl]
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - ${UPLOAD_LOCATION}/synced:/synced
    env_file:
      - .env
    depends_on:
      - redis
      - database
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - immich_internal
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    user: "${PUID}:${PGID}"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    # For hardware acceleration, uncomment the extends section below
    # and set the service to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn]
    # AMD GPU: use rocm
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - immich_internal
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    volumes:
      - ./redis:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - immich_internal
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    #tmpfs: # This line was added to try and solve a log output error. -Nneon
    #  - /var/run/postgresql
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: "${PUID}:${PGID}"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if your database is stored on HDDs instead of SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
      #- SETUID
      #- SETGID
      #- CHOWN
      #- FOWNER
      #- DAC_OVERRIDE
    networks:
      - immich_internal
    healthcheck:
      disable: false

volumes:
  model-cache:

networks:
  frontend:
    external: true
  immich_internal:
    driver: bridge